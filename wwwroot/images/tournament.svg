<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" role="img" aria-labelledby="title desc">
  <title id="title">Tournament Hub Neon Emblem</title>
  <desc id="desc">Cyberpunk tournament crest with cyan and magenta light trails.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171a3b"/><stop offset=".52" stop-color="#10192d"/><stop offset="1" stop-color="#240d2d"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d7fffb"/><stop offset=".4" stop-color="#59fff0"/><stop offset="1" stop-color="#1686aa"/></linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff9ddd"/><stop offset="1" stop-color="#ff43bd"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#edff9a"/><stop offset="1" stop-color="#b3d934"/></linearGradient>
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glowPink" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#59fff0" stroke-opacity=".14" stroke-width=".8"/></pattern>
  </defs>
  <rect width="520" height="360" rx="26" fill="#080a12"/>
  <rect x="8" y="8" width="504" height="344" rx="22" fill="url(#bg)" stroke="#59fff0" stroke-opacity=".52"/>
  <rect x="18" y="18" width="484" height="324" rx="16" fill="url(#grid)"/>
  <path d="M28 88V28H105 M415 28h77v60 M28 270v62h77 M415 332h77v-62" fill="none" stroke="#ff43bd" stroke-width="2" stroke-opacity=".9"/>
  <path d="M42 180h85m266 0h85M260 35v47m0 196v47" stroke="#59fff0" stroke-opacity=".35" stroke-dasharray="4 7"/>
  <g filter="url(#glowCyan)">
    <path d="M260 64 337 101 326 205 260 259 194 205 183 101Z" fill="#08101b" fill-opacity=".7" stroke="url(#cyan)" stroke-width="3"/>
    <path d="M260 80 319 109 311 193 260 235 209 193 201 109Z" fill="none" stroke="#59fff0" stroke-opacity=".42" stroke-width="1.5"/>
    <path d="M207 114h38l15 15 15-15h38l-13 26-40 39-40-39z" fill="url(#cyan)"/>
    <path d="M228 146h64l-8 20-24 25-24-25z" fill="#10182a" stroke="#59fff0" stroke-width="2"/>
    <path d="M242 158h36l-18 20z" fill="url(#pink)"/>
  </g>
  <g filter="url(#glowPink)" fill="none" stroke="url(#pink)" stroke-width="3" stroke-linejoin="round">
    <path d="M172 118h-29l-12 16v34l12 12h32"/>
    <path d="M348 118h29l12 16v34l-12 12h-32"/>
    <path d="M174 222h-24l-13 14v16l13 13h38"/>
    <path d="M346 222h24l13 14v16l-13 13h-38"/>
  </g>
  <path d="M86 58h95M339 58h95M86 301h95M339 301h95" stroke="#59fff0" stroke-opacity=".44"/>
  <g font-family="Orbitron,Arial,sans-serif" text-anchor="middle" font-weight="800">
    <text x="260" y="48" fill="#eafaff" font-size="14" letter-spacing="4">TOURNAMENT</text>
    <text x="260" y="292" fill="#59fff0" font-size="21" letter-spacing="7">HUB</text>
    <text x="260" y="319" fill="#9ca7c0" font-size="8" letter-spacing="3">COMPETE // CONQUER // REPEAT</text>
  </g>
  <circle cx="55" cy="53" r="3" fill="#d7ff4f"/><circle cx="465" cy="307" r="3" fill="#d7ff4f"/>
  <circle cx="464" cy="53" r="2" fill="#ff43bd"/><circle cx="56" cy="307" r="2" fill="#ff43bd"/>
</svg>
